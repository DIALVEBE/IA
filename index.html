<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Artificial Intelligence course notebook and bilingual slide deck.">
    <title>Artificial Intelligence | Course Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#intro" aria-label="Artificial Intelligence course home">
          <span class="brand-mark">AI</span>
          <span>
            <strong>Artificial Intelligence</strong>
            <small>Course notebook</small>
          </span>
        </a>

        <nav class="top-actions" aria-label="Presentation controls">
          <button class="icon-button" id="prevSlide" type="button" aria-label="Previous slide" title="Previous">
            <span aria-hidden="true">‹</span>
          </button>
          <span class="counter" id="slideCounter">01 / 12</span>
          <button class="icon-button" id="nextSlide" type="button" aria-label="Next slide" title="Next">
            <span aria-hidden="true">›</span>
          </button>
          <div class="language-toggle" aria-label="Language">
            <button type="button" class="active" data-lang="en">EN</button>
            <button type="button" data-lang="es">ES</button>
          </div>
        </nav>
      </header>

      <main class="stage-layout">
        <aside class="sidebar" aria-label="Topic navigation">
          <p class="eyebrow">Syllabus</p>
          <ol id="topicList"></ol>
        </aside>

        <section class="deck" id="deck" aria-live="polite"></section>
      </main>

    </div>

    <script src="script.js"></script>
  </body>
</html>
